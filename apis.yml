aid: plush
name: Plush
description: >-
  Plush is an AI-powered fashion discovery and shopping platform at plush.shop
  that lets shoppers describe what they want in natural language and returns
  curated results from trusted and emerging brands. Rather than rigid keyword
  search, Plush matches on mood, aesthetic, and intent, layering image search,
  smart real-time filters, influencer edit collections, and wishlists on top of
  its proprietary AI curation. Founded by Chang Liu (CEO) and Ying Zhu (CTO) —
  who met through Y Combinator's co-founder matching — Plush is backed by the
  Anthemis Female Innovators Lab Fund and the Oxford Seed Fund. It is a
  consumer-facing web application; no public developer API is published at this
  time.
